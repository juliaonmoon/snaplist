<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Julia's GitHub Dashboard</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --amber: #d29922;
      --blue: #58a6ff;
      --purple: #bc8cff;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .header {
      max-width: 1100px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2px solid var(--border);
    }
    .header-text h1 { font-size: 22px; font-weight: 700; }
    .header-text p { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .last-updated { margin-left: auto; font-size: 12px; color: var(--muted); }

    .stats-row {
      max-width: 1100px;
      margin: 0 auto 28px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }
    .stat-card .val {
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-card .lbl { font-size: 12px; color: var(--muted); }

    .grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 760px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-header .count {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
    }

    /* Repo list */
    .repo-item {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
    }
    .repo-item:last-child { border-bottom: none; }
    .repo-name { font-size: 14px; font-weight: 600; color: var(--blue); }
    .repo-desc { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .repo-meta { display: flex; gap: 12px; margin-top: 8px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }
    .lang-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .repo-right { text-align: right; }
    .ci-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 99px;
      font-size: 11px; font-weight: 600;
    }
    .ci-pass { background: rgba(63,185,80,.15); color: var(--green); border: 1px solid rgba(63,185,80,.3); }
    .ci-fail { background: rgba(248,81,73,.15); color: var(--red); border: 1px solid rgba(248,81,73,.3); }
    .ci-running { background: rgba(210,153,34,.15); color: var(--amber); border: 1px solid rgba(210,153,34,.3); }
    .ci-none { background: rgba(139,148,158,.1); color: var(--muted); border: 1px solid var(--border); }

    /* Commits */
    .commit-item {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .commit-item:last-child { border-bottom: none; }
    .commit-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .commit-msg { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .commit-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .commit-sha { font-family: monospace; font-size: 11px; color: var(--blue); }

    /* Issues / PRs */
    .issue-item {
      padding: 11px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .issue-item:last-child { border-bottom: none; }
    .issue-title { font-size: 13px; font-weight: 500; }
    .issue-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .pr-badge { font-size: 11px; color: var(--purple); font-weight: 600; }

    /* Workflows panel */
    .wf-item {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .wf-item:last-child { border-bottom: none; }
    .wf-name { font-size: 13px; font-weight: 500; flex: 1; }
    .wf-time { font-size: 11px; color: var(--muted); }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-row {
      padding: 32px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .empty { padding: 24px 18px; text-align: center; color: var(--muted); font-size: 13px; }
    .error-note { padding: 12px 18px; font-size: 12px; color: var(--amber); }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .refresh-btn:hover { color: var(--text); border-color: var(--muted); }
  </style>
</head>
<body>

<div class="header">
  <img class="avatar" src="https://github.com/juliaonmoon.png" alt="juliaonmoon" />
  <div class="header-text">
    <h1>juliaonmoon</h1>
    <p>GitHub Activity Dashboard</p>
  </div>
  <div class="last-updated">
    <span id="updated-at">Loading…</span>
    &nbsp;
    <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
  </div>
</div>

<div class="stats-row" id="stats-row">
  <div class="stat-card"><div class="val" id="stat-repos">—</div><div class="lbl">Public repos</div></div>
  <div class="stat-card"><div class="val" id="stat-open-issues" style="color:var(--amber)">—</div><div class="lbl">Open issues</div></div>
  <div class="stat-card"><div class="val" id="stat-open-prs" style="color:var(--purple)">—</div><div class="lbl">Open PRs</div></div>
  <div class="stat-card"><div class="val" id="stat-ci" style="color:var(--green)">—</div><div class="lbl">CI passing</div></div>
</div>

<div class="grid">
  <!-- LEFT COLUMN -->
  <div style="display:flex; flex-direction:column; gap:20px;">

    <!-- Repos -->
    <div class="panel">
      <div class="panel-header">
        📦 Repositories
        <span class="count" id="repo-count"></span>
      </div>
      <div id="repos-list"><div class="loading-row"><span class="spinner"></span> Fetching repos…</div></div>
    </div>

    <!-- Recent commits (across repos) -->
    <div class="panel">
      <div class="panel-header">
        🔀 Recent Commits
        <span class="count" id="commit-count"></span>
      </div>
      <div id="commits-list"><div class="loading-row"><span class="spinner"></span> Fetching commits…</div></div>
    </div>

  </div>

  <!-- RIGHT COLUMN -->
  <div style="display:flex; flex-direction:column; gap:20px;">

    <!-- Workflow runs -->
    <div class="panel">
      <div class="panel-header">⚙️ CI / Workflows</div>
      <div id="workflows-list"><div class="loading-row"><span class="spinner"></span></div></div>
    </div>

    <!-- Open Issues -->
    <div class="panel">
      <div class="panel-header">🐛 Open Issues</div>
      <div id="issues-list"><div class="loading-row"><span class="spinner"></span></div></div>
    </div>

    <!-- Open PRs -->
    <div class="panel">
      <div class="panel-header">🔁 Open Pull Requests</div>
      <div id="prs-list"><div class="loading-row"><span class="spinner"></span></div></div>
    </div>

  </div>
</div>

<script>
const USER = 'juliaonmoon'
const BASE = 'https://api.github.com'

const LANG_COLORS = {
  JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#3572A5',
  HTML: '#e34c26', CSS: '#563d7c', Shell: '#89e051',
  Vue: '#41b883', Svelte: '#ff3e00', Go: '#00ADD8', Rust: '#dea584',
}

async function gh(path) {
  const r = await fetch(`${BASE}${path}`, {
    headers: { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
  })
  if (!r.ok) throw new Error(`${r.status} ${path}`)
  return r.json()
}

function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000)
  if (s < 60)  return `${s}s ago`
  if (s < 3600) return `${Math.floor(s/60)}m ago`
  if (s < 86400) return `${Math.floor(s/3600)}h ago`
  return `${Math.floor(s/86400)}d ago`
}

function ciBadge(conclusion, status) {
  if (status === 'in_progress' || status === 'queued')
    return `<span class="ci-badge ci-running">⏳ Running</span>`
  if (conclusion === 'success')
    return `<span class="ci-badge ci-pass">✓ Pass</span>`
  if (conclusion === 'failure')
    return `<span class="ci-badge ci-fail">✗ Fail</span>`
  return `<span class="ci-badge ci-none">— No CI</span>`
}

function el(id) { return document.getElementById(id) }
function setHTML(id, html) { el(id).innerHTML = html }

async function loadRepos() {
  const repos = await gh(`/users/${USER}/repos?sort=pushed&per_page=20`)
  el('stat-repos').textContent = repos.length

  // fetch latest workflow run per repo (best-effort, parallel)
  const withCI = await Promise.all(repos.map(async repo => {
    try {
      const runs = await gh(`/repos/${USER}/${repo.name}/actions/runs?per_page=1`)
      const run = runs.workflow_runs?.[0]
      return { ...repo, _run: run }
    } catch {
      return { ...repo, _run: null }
    }
  }))

  const passing = withCI.filter(r => r._run?.conclusion === 'success').length
  el('stat-ci').textContent = passing

  el('repo-count').textContent = `${repos.length} repos`
  setHTML('repos-list', withCI.map(repo => {
    const lang = repo.language
    const dot = lang
      ? `<span class="lang-dot" style="background:${LANG_COLORS[lang] || '#8b949e'}"></span>${lang}`
      : ''
    const stars = repo.stargazers_count > 0
      ? `⭐ ${repo.stargazers_count}` : ''
    const updated = timeAgo(repo.pushed_at)
    const badge = repo._run
      ? ciBadge(repo._run.conclusion, repo._run.status)
      : `<span class="ci-badge ci-none">— No CI</span>`

    return `<div class="repo-item">
      <div>
        <div class="repo-name"><a href="${repo.html_url}" target="_blank">${repo.name}</a></div>
        ${repo.description ? `<div class="repo-desc">${repo.description}</div>` : ''}
        <div class="repo-meta">
          ${dot ? `<span>${dot}</span>` : ''}
          ${stars ? `<span>${stars}</span>` : ''}
          <span>Updated ${updated}</span>
        </div>
      </div>
      <div class="repo-right">${badge}</div>
    </div>`
  }).join(''))

  return withCI
}

async function loadCommits(repos) {
  const top = repos.slice(0, 5)
  const allCommits = await Promise.all(top.map(async repo => {
    try {
      const commits = await gh(`/repos/${USER}/${repo.name}/commits?per_page=5`)
      return commits.map(c => ({ ...c, _repo: repo.name }))
    } catch { return [] }
  }))

  const flat = allCommits.flat()
    .sort((a, b) => new Date(b.commit.author.date) - new Date(a.commit.author.date))
    .slice(0, 15)

  el('commit-count').textContent = `${flat.length} shown`
  if (!flat.length) { setHTML('commits-list', '<div class="empty">No commits found</div>'); return }

  setHTML('commits-list', flat.map(c => {
    const msg = c.commit.message.split('\n')[0].slice(0, 80)
    const when = timeAgo(c.commit.author.date)
    const sha = c.sha.slice(0, 7)
    return `<div class="commit-item">
      <div class="commit-icon">●</div>
      <div style="min-width:0">
        <div class="commit-msg" title="${c.commit.message.split('\n')[0]}">${msg}</div>
        <div class="commit-meta">
          <a href="${c.html_url}" target="_blank" class="commit-sha">${sha}</a>
          &nbsp;·&nbsp; ${c._repo}
          &nbsp;·&nbsp; ${when}
        </div>
      </div>
    </div>`
  }).join(''))
}

async function loadWorkflows(repos) {
  const rows = []
  for (const repo of repos.slice(0, 8)) {
    try {
      const runs = await gh(`/repos/${USER}/${repo.name}/actions/runs?per_page=3`)
      for (const run of runs.workflow_runs || []) {
        rows.push({ repo: repo.name, run })
      }
    } catch {}
  }
  rows.sort((a, b) => new Date(b.run.updated_at) - new Date(a.run.updated_at))
  const shown = rows.slice(0, 10)

  if (!shown.length) { setHTML('workflows-list', '<div class="empty">No workflow runs found</div>'); return }

  setHTML('workflows-list', shown.map(({ repo, run }) => {
    const badge = ciBadge(run.conclusion, run.status)
    const when = timeAgo(run.updated_at)
    const name = run.name.length > 28 ? run.name.slice(0, 28) + '…' : run.name
    return `<div class="wf-item">
      <div>
        <div class="wf-name"><a href="${run.html_url}" target="_blank">${name}</a></div>
        <div class="wf-time">${repo} · ${when}</div>
      </div>
      ${badge}
    </div>`
  }).join(''))
}

async function loadIssues() {
  const data = await gh(`/search/issues?q=user:${USER}+type:issue+state:open&per_page=10`)
  el('stat-open-issues').textContent = data.total_count

  const items = data.items || []
  if (!items.length) { setHTML('issues-list', '<div class="empty">No open issues 🎉</div>'); return }

  setHTML('issues-list', items.map(issue => {
    const repo = issue.repository_url.split('/').pop()
    const when = timeAgo(issue.created_at)
    return `<div class="issue-item">
      <div>
        <div class="issue-title"><a href="${issue.html_url}" target="_blank">#${issue.number} ${issue.title}</a></div>
        <div class="issue-meta">${repo} · opened ${when}</div>
      </div>
    </div>`
  }).join(''))
}

async function loadPRs() {
  const data = await gh(`/search/issues?q=user:${USER}+type:pr+state:open&per_page=10`)
  el('stat-open-prs').textContent = data.total_count

  const items = data.items || []
  if (!items.length) { setHTML('prs-list', '<div class="empty">No open PRs</div>'); return }

  setHTML('prs-list', items.map(pr => {
    const repo = pr.repository_url.split('/').pop()
    const when = timeAgo(pr.created_at)
    return `<div class="issue-item">
      <div>
        <div class="issue-title">
          <span class="pr-badge">PR </span>
          <a href="${pr.html_url}" target="_blank">#${pr.number} ${pr.title}</a>
        </div>
        <div class="issue-meta">${repo} · opened ${when}</div>
      </div>
    </div>`
  }).join(''))
}

async function loadAll() {
  el('updated-at').textContent = 'Refreshing…'

  // Reset panels
  const loadingHTML = '<div class="loading-row"><span class="spinner"></span></div>'
  ;['repos-list','commits-list','workflows-list','issues-list','prs-list']
    .forEach(id => setHTML(id, loadingHTML))
  ;['stat-repos','stat-open-issues','stat-open-prs','stat-ci']
    .forEach(id => el(id).textContent = '—')

  try {
    const repos = await loadRepos()
    await Promise.all([
      loadCommits(repos),
      loadWorkflows(repos),
      loadIssues(),
      loadPRs(),
    ])
    el('updated-at').textContent = 'Updated ' + new Date().toLocaleTimeString()
  } catch(e) {
    el('updated-at').textContent = 'Error — ' + e.message
    console.error(e)
  }
}

loadAll()
// Auto-refresh every 3 minutes
setInterval(loadAll, 3 * 60 * 1000)
</script>
</body>
</html>
